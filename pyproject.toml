[project]
name = "ticketswap-tap-opencx"
version = "0.0.1"
description = "`tap-opencx` is a Singer tap for OpenCX, built with the Meltano Singer SDK."
readme = "README.md"
authors = [{ name = "Iiro Sokka", email = "iiro.sokka@ticketswap.com" }]
keywords = [
    "ELT",
    "OpenCX",
]
classifiers = [
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
license = "Apache-2.0"
license-files = [ "LICENSE" ]
requires-python = ">=3.11"

dependencies = [
    "singer-sdk>=0.54.9",
    "requests",
]

[project.optional-dependencies]
s3 = [
    "s3fs",
]

[project.scripts]
# CLI declaration
tap-opencx = 'tap_opencx.tap:TapOpenCX.cli'

[dependency-groups]
dev = [
    { include-group = "test" },
]
test = [
    "pytest>=9.1.1",
    "pytest-github-actions-annotate-failures>=0.4.2",
    "singer-sdk[testing]",
]
[tool.hatch.build.targets.wheel]
packages = [
    "tap_opencx",
]

[tool.pytest.ini_options]
addopts = [
    "--durations=10",
]

[tool.mypy]
warn_unused_configs = true
plugins = "sqlmypy"

[tool.ruff.lint]
ignore = [
    "COM812",  # missing-trailing-comma
    "CPY001",
]
select = ["ALL"]

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true

[tool.ruff.lint.pydocstyle]
convention = "google"

[build-system]
requires = [
    "hatchling>=1,<2",
]
build-backend = "hatchling.build"

[tool.tox]
requires = [
    "tox>=4.53",
    "tox-uv>=1.35",
]
env_list = [
    { prefix = "3.", start = 11 },
]

[tool.tox.env_run_base]
description = "run tests on Python {env_name}"
runner = "uv-venv-lock-runner"
pass_env = [
    "CI",
    "GITHUB_*",
    "TAP_OPENCX_*",
]
dependency_groups = [ "test" ]
commands = [ [ "pytest", { replace = "posargs", default = [ "tests" ], extend = true } ] ]
